server.port=8080
spring.application.name=booking-service

# H2 Database
spring.datasource.url=jdbc:h2:mem:bookingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Service URLs for WebClient
user.service.url=http://localhost:8081
notification.service.url=http://localhost:8085

# Service URLs for Feign Client
flight.service.url=http://localhost:8082
hotel.service.url=http://localhost:8083
